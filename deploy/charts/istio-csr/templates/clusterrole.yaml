kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    {{- include "cert-manager-istio-csr.labels" . | nindent 4 }}
  name: {{ include "cert-manager-istio-csr.name" . }}
rules:
  # 'create' cannot be restricted by resourceNames in Kubernetes RBAC.
  # 'list' and 'watch' must remain unscoped for the ConfigMap informer cache to work.
- apiGroups:
  - ""
  resources:
  - "configmaps"
  verbs: ["create", "list", "watch"]
  # get/update are limited to the istio-ca-root-cert ConfigMap name.
- apiGroups:
  - ""
  resources:
  - "configmaps"
  verbs: ["get", "update"]
  resourceNames:
  - "istio-ca-root-cert"
- apiGroups:
  - ""
  resources:
  - "namespaces"
  {{- if .Values.app.server.caTrustedNodeAccounts }}
  - "pods"
  {{- end }}
  verbs: ["get", "list", "watch"]
- apiGroups:
  - "authentication.k8s.io"
  resources:
  - "tokenreviews"
  verbs:
  - "create"
{{- if eq (toString .Values.app.tls.istiodCertificateEnable) "dynamic" }}
- apiGroups:
  - "cert-manager.io"
  resources:
  - "certificates"
  verbs:
  - "list"
  - "get"
  - "watch"
{{- end }}
