{{- if and .Values.app.metrics.service.enabled .Values.app.metrics.service.servicemonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cert-manager-istio-csr.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- /*
      Merged as one map so no key can be emitted twice, keeping the precedence
      the concatenated form had: "app" stays overridable, while the prometheus
      instance label and .Values.app.metrics.service.servicemonitor.labels
      still win over .Values.commonLabels.
    */}}
    {{- $labels := mergeOverwrite
          (dict "app" (include "cert-manager-istio-csr.name" .))
          (include "cert-manager-istio-csr.labels" . | fromYaml)
          (dict "prometheus" .Values.app.metrics.service.servicemonitor.prometheusInstance)
          (.Values.app.metrics.service.servicemonitor.labels | default dict)
    -}}
    {{- toYaml $labels | nindent 4 }}
spec:
  jobLabel: {{ include "cert-manager-istio-csr.name" . }}
  selector:
    matchLabels:
      app: {{ include "cert-manager-istio-csr.name" . }}-metrics
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
  - targetPort: {{ .Values.app.metrics.port }}
    path: "/metrics"
    interval: {{ .Values.app.metrics.service.servicemonitor.interval }}
    scrapeTimeout: {{ .Values.app.metrics.service.servicemonitor.scrapeTimeout }}
{{- end }}
